apiVersion: apps/v1
kind: Deployment
metadata:
    name: teamflow-celery
    namespace: teamflow-namespace
    labels:
        app: teamflow-celery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: teamflow-celery
  template:
    metadata:
      labels:
        app: teamflow-celery
    spec:
      containers:
        - name: teamflow-celery
          image: engrmarkk/teamflow-celery:latest
          envFrom:
            - configMapRef:
                name: teamflow-config
            - secretRef:
                name: teamflow-secret
